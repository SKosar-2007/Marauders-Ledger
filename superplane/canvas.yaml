apiVersion: v1
kind: Canvas
metadata:
  id: 6400b0b3-2a35-425e-b499-8b4c65984dab
  name: OmniLedger Pipeline
spec:
  edges:
    - sourceId: webhook-csv-uploaded
      targetId: http-validate-csv
      channel: default
    - sourceId: http-validate-csv
      targetId: http-feature-engineering
      channel: default
    - sourceId: http-validate-csv
      targetId: http-rule-engine
      channel: default
    - sourceId: http-feature-engineering
      targetId: http-ml-ensemble
      channel: default
    - sourceId: http-ml-ensemble
      targetId: http-score-fusion
      channel: default
    - sourceId: http-rule-engine
      targetId: http-score-fusion
      channel: default
    - sourceId: http-score-fusion
      targetId: http-severity-classification
      channel: default
    - sourceId: http-severity-classification
      targetId: http-store-anomalies
      channel: default
    - sourceId: http-severity-classification
      targetId: http-narrative-generation
      channel: default
    - sourceId: http-narrative-generation
      targetId: http-tts-generation
      channel: default
    - sourceId: http-narrative-generation
      targetId: http-store-narratives
      channel: default
    - sourceId: http-tts-generation
      targetId: http-store-narratives
      channel: default
    - sourceId: http-severity-classification
      targetId: http-dashboard-update
      channel: default

  nodes:
    - id: webhook-csv-uploaded
      name: CSV Uploaded
      type: TYPE_TRIGGER
      component: webhook
      paused: false
      configuration:
        method: POST
        path: /marauders/csv-uploaded
        customName: "CSV Uploaded — {{ now() }}"

    - id: http-validate-csv
      name: Validate CSV
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/validate"
        headers: { "Content-Type": "application/json" }
        body: "{{ trigger.body }}"
        customName: "Validate batch {{ trigger.body.batch_id }}"

    - id: http-feature-engineering
      name: Feature Engineering
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/features"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-validate-csv.output }}"
        customName: "Extract features for batch {{ trigger.body.batch_id }}"

    - id: http-ml-ensemble
      name: ML Ensemble Detection
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/ml-detect"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-feature-engineering.output }}"
        customName: "ML detect batch {{ trigger.body.batch_id }}"

    - id: http-rule-engine
      name: Rule Engine
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/rules"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-validate-csv.output }}"
        customName: "Rules for batch {{ trigger.body.batch_id }}"

    - id: http-score-fusion
      name: Score Fusion
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/fuse"
        headers: { "Content-Type": "application/json" }
        body: '{ "ml_scores": {{ nodes.http-ml-ensemble.output }}, "rule_scores": {{ nodes.http-rule-engine.output }}, "batch_id": "{{ trigger.body.batch_id }}" }'
        customName: "Fuse scores for batch {{ trigger.body.batch_id }}"

    - id: http-severity-classification
      name: Severity Classification
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/classify"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-score-fusion.output }}"
        customName: "Classify batch {{ trigger.body.batch_id }}"

    - id: http-store-anomalies
      name: Store Anomalies
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/store"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-severity-classification.output }}"
        customName: "Store anomalies for batch {{ trigger.body.batch_id }}"

    - id: http-narrative-generation
      name: Gemini AI Narration
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/narrate"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-severity-classification.output }}"
        customName: "Narrate anomalies for batch {{ trigger.body.batch_id }}"

    - id: http-tts-generation
      name: ElevenLabs TTS
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/tts"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-narrative-generation.output }}"
        customName: "TTS for batch {{ trigger.body.batch_id }}"

    - id: http-store-narratives
      name: Store Narratives & Audio
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/store-narratives"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-tts-generation.output }}"
        customName: "Store narratives for batch {{ trigger.body.batch_id }}"

    - id: http-dashboard-update
      name: Dashboard Update
      type: TYPE_ACTION
      component: http
      paused: false
      configuration:
        method: POST
        url: "http://backend:8000/api/pipeline/notify"
        headers: { "Content-Type": "application/json" }
        body: "{{ nodes.http-severity-classification.output }}"
        customName: "Notify dashboard for batch {{ trigger.body.batch_id }}"
