services:
  redis:
    image: redis:7-alpine
    container_name: marauders-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vectorai:
    image: actian/vectorai:latest
    container_name: marauders-vectorai
    ports:
      - "6573:6573"
      - "6574:6574"
      - "6575:6575"
    environment:
      - ACTIAN_VECTORAI_ACCEPT_EULA=YES
    env_file:
      - .env
    volumes:
      - vectorai-data:/var/lib/actian-vectorai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import httpx; httpx.get('http://localhost:6575/').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: marauders-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTORAI_HOST=vectorai
      - VECTORAI_PORT=6574
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      vectorai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery-worker:
    build:
      context: ./backend
    container_name: marauders-celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - VECTORAI_HOST=vectorai
      - VECTORAI_PORT=6574
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    container_name: marauders-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vectorai-data:
  redis-data:
