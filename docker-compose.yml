services:
  backend:
    build:
      context: ./backend
    container_name: marauders-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: marauders-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
