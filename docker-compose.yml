services:
  redis:
    image: redis:7-alpine
    container_name: marauders-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  vectorai:
    image: actian/vectorai:community
    container_name: marauders-vectorai
    ports:
      - "6574:6574"
    environment:
      - VECTORAI_LICENSE_KEY=H894W-WBGRK-J74P-HCP8D-JJ9BC-G9V7
    volumes:
      - vectorai-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vectorai", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    container_name: marauders-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTORAI_HOST=vectorai
      - VECTORAI_PORT=6574
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      vectorai:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  celery-worker:
    build:
      context: ./backend
    container_name: marauders-celery
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - VECTORAI_HOST=vectorai
      - VECTORAI_PORT=6574
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
    container_name: marauders-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: marauders-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  vectorai-data:
  redis-data:
